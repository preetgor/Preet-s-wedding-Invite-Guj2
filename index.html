    if ('requestIdleCallback' in window) window.requestIdleCallback(callback, { timeout: timeout || 1200 });
    else window.setTimeout(callback, Math.min(timeout || 300, 500));
  }
  function createPicture(pageIndex, highPriority) {
    var picture = document.createElement('picture');
    [
      { media: '(max-width: 640px)', size: 800 },
      { media: '(max-width: 1280px)', size: 1200 },
      { media: '', size: 2000 }
    ].forEach(function (variant) {
      var source = document.createElement('source');
      if (variant.media) source.media = variant.media;
      source.type = 'image/webp';
      source.srcset = asset(pageIndex, variant.size, 'webp');
      picture.appendChild(source);
    });
    var image = document.createElement('img');
    image.src = asset(pageIndex, 1400, 'jpg');
    image.alt = pages[pageIndex].alt;
    image.width = 1400;
    image.height = 1400;
    image.decoding = 'async';
    image.draggable = false;
    if (highPriority) image.fetchPriority = 'high';
    picture.appendChild(image);
    return picture;
  }
  function warmNextPage() {
    idle(function () { warmPage(index + 1); }, 450);
  }
  if (currentImage.complete) warmNextPage();
  else currentImage.addEventListener('load', warmNextPage, { once: true });

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function dismissHint() {
    if (hintDismissed) return;
    hintDismissed = true;
    hint.classList.remove('visible');
  }
  document.addEventListener('pointerdown', dismissHint, { once: true, capture: true });
  function positionNavIndicator() {
    var active = navLinks.querySelector('.nav-link.active');
    if (!active) return;
    navIndicator.style.width = active.offsetWidth + 'px';
    navIndicator.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  }
  function panLimits() {
    var r = book.getBoundingClientRect();
    return { x: Math.max(0, r.width * (scale - 1) / 2), y: Math.max(0, r.height * (scale - 1) / 2) };
  }
  function applyTransform() {
    var limits = panLimits();
    panX = clamp(panX, -limits.x, limits.x); panY = clamp(panY, -limits.y, limits.y);
    surface.style.transform = 'translate3d(' + panX + 'px,' + panY + 'px,0) scale(' + scale + ')';
    zoomReadout.textContent = Math.round(scale * 100) + '%';
    book.classList.toggle('is-panning', scale > 1);
    prevEdge.style.pointerEvents = scale > 1 ? 'none' : '';
    nextEdge.style.pointerEvents = scale > 1 ? 'none' : '';
  }
  function setZoom(next, focalX, focalY) {
    dismissHint();
    var old = scale;
    scale = clamp(next, 1, 4);
    if (scale === 1) { panX = 0; panY = 0; }
    else if (focalX != null && focalY != null) {
      var r = book.getBoundingClientRect();
      var dx = focalX - (r.left + r.width / 2), dy = focalY - (r.top + r.height / 2);
      panX = dx - (dx - panX) * (scale / old);
      panY = dy - (dy - panY) * (scale / old);
    }
    applyTransform();
  }
  function resetZoom() { scale = 1; panX = 0; panY = 0; applyTransform(); }
  function updateUI() {
    Array.prototype.forEach.call(dots.querySelectorAll('.dot'), function (d, i) {
      d.classList.toggle('active', i === index);
      d.setAttribute('aria-current', i === index ? 'page' : 'false');
    });
    Array.prototype.forEach.call(navLinks.querySelectorAll('.nav-link'), function (link, i) {
      link.classList.toggle('active', i === index);
      link.setAttribute('aria-current', i === index ? 'page' : 'false');
    });
    dots.style.setProperty('--active-index', index);
    positionNavIndicator();
    pageCount.textContent = (index + 1) + ' / ' + pages.length;
    prevEdge.disabled = index === 0; nextEdge.disabled = index === pages.length - 1;
  }
  function goTo(target) {
    if (busy || target === index || target < 0 || target >= pages.length) return;
    dismissHint();
    warmPage(target);
    resetZoom(); busy = true;
    var oldIndex = index, direction = target > oldIndex ? 'next' : 'prev';
    var animatedPage = document.createElement('article');
    var targetPicture = createPicture(target, true);
    var targetImage = targetPicture.querySelector('img');
    animatedPage.appendChild(targetPicture);

    function beginTurn() {
      if (!busy || index !== oldIndex) return;
      if (direction === 'next') {
        animatedPage.className = 'page-layer reveal';
        surface.insertBefore(animatedPage, current);
        current.classList.add('turn-next');
      } else {
        current.classList.add('reveal-back');
        animatedPage.className = 'page-layer turn-prev';
        surface.appendChild(animatedPage);
      }
      index = target; updateUI();
      window.setTimeout(function () {
        current.replaceChildren(targetPicture);
        currentImage = targetImage;
        current.className = 'page-layer';
        if (animatedPage.parentNode) animatedPage.parentNode.removeChild(animatedPage);
        busy = false;
        idle(function () { warmPage(target + (direction === 'next' ? 1 : -1)); }, 450);
      }, 720);
    }

    if (targetImage.complete && targetImage.naturalWidth) beginTurn();
    else targetImage.addEventListener('load', beginTurn, { once: true });
  }
  function next() { goTo(index + 1); }
  function prev() { goTo(index - 1); }
  prevEdge.addEventListener('pointerenter', function () { warmPage(index - 1); });
  nextEdge.addEventListener('pointerenter', function () { warmPage(index + 1); });
  prevEdge.addEventListener('pointerdown', function () { warmPage(index - 1); });
  nextEdge.addEventListener('pointerdown', function () { warmPage(index + 1); });
  prevEdge.addEventListener('click', prev); nextEdge.addEventListener('click', next);
  document.getElementById('zoomIn').addEventListener('click', function () { setZoom(scale + .5); });
  document.getElementById('zoomOut').addEventListener('click', function () { setZoom(scale - .5); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' && scale === 1) { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft' && scale === 1) { e.preventDefault(); prev(); }
    if ((e.key === '+' || e.key === '=') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); setZoom(scale + .5); }
    if (e.key === '-' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); setZoom(scale - .5); }
    if (e.key === '0' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); resetZoom(); }
  });
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    dismissHint();
    if (e.ctrlKey || e.metaKey) {
      setZoom(scale * Math.exp(-e.deltaY * .002), e.clientX, e.clientY);
      return;
    }
    if (scale > 1) {
      panX -= e.deltaX;
      panY -= e.deltaY;
      applyTransform();
      return;
    }
    // At the fitted view, wheel and trackpad gestures intentionally do not turn pages.
    // Navigation remains swipe-, tap-, dot-, nav-, and keyboard-driven.
  }, { passive: false });
  book.addEventListener('pointerdown', function (e) {
    dismissHint();
    book.classList.add('is-direct');
    book.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) gestureStart = { x: e.clientX, y: e.clientY, panX: panX, panY: panY, time: Date.now() };
    if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      pinchStart = { distance: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y), scale: scale, panX: panX, panY: panY, centerX: (pts[0].x + pts[1].x) / 2, centerY: (pts[0].y + pts[1].y) / 2 };
    }
  });
  book.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && pinchStart) {
      var pts = Array.from(pointers.values());
      var dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      var cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
      scale = clamp(pinchStart.scale * dist / Math.max(1, pinchStart.distance), 1, 4);
      panX = pinchStart.panX + cx - pinchStart.centerX; panY = pinchStart.panY + cy - pinchStart.centerY;
      if (scale === 1) { panX = 0; panY = 0; }
      applyTransform();
    } else if (pointers.size === 1 && scale > 1 && gestureStart) {
      panX = gestureStart.panX + e.clientX - gestureStart.x; panY = gestureStart.panY + e.clientY - gestureStart.y; applyTransform();
    }
  });
  function endPointer(e) {
    var start = gestureStart; pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0 && start) {
      var dx = e.clientX - start.x, dy = e.clientY - start.y, elapsed = Date.now() - start.time;
      if (scale === 1 && elapsed < 800) {
        var horizontalSwipe = Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.2;
        var verticalSwipe = Math.abs(dy) > 46 && Math.abs(dy) > Math.abs(dx) * 1.2;
        if (horizontalSwipe) { dx < 0 ? next() : prev(); }
        else if (verticalSwipe) { dy < 0 ? next() : prev(); }
      }
      var moved = Math.hypot(dx, dy);
      if (moved < 12 && elapsed < 350) {
        var now = Date.now();
        if (now - lastTap < 330) { setZoom(scale > 1 ? 1 : 2.25, e.clientX, e.clientY); lastTap = 0; }
        else lastTap = now;
      }
      gestureStart = null;
      book.classList.remove('is-direct');
    }
  }
  book.addEventListener('pointerup', endPointer); book.addEventListener('pointercancel', endPointer);
  window.addEventListener('resize', function () {
    applyTransform();
    positionNavIndicator();
    if (!busy) {
      current.classList.remove('page-settle');
      void current.offsetWidth;
      current.classList.add('page-settle');
      window.setTimeout(function () { current.classList.remove('page-settle'); }, 480);
    }
  });
  updateUI(); applyTransform();
  window.setTimeout(function () { current.classList.remove('page-settle'); }, 480);
  }
  window.requestAnimationFrame(function () {
    window.requestAnimationFrame(startInvitation);
  });
})();
</script>
